          "type": "sort",
          "stem": "<p>Classify each of these everyday changes.</p>",
          "items": [
            {"text":"Candle wax melting in the heat of the flame", "bin":0, "why":"Melting is a change of state — the wax is still wax."},

            {"text":"A nail left in the rain turning orange and flaky", "bin":1, "why":"Rust, a new substance, has formed on the iron."},
            {"text":"Salt crystals reappearing when sea water evaporates", "bin":0, "why":"A separation — the salt was never chemically changed."},
            {"text":"Baking a cake in an oven", "bin":1, "why":"Heat forms new substances in the batter, and you cannot reverse it."},
            {"text":"A copper wire being bent into a coil", "bin":0, "why":"Only the shape changes; it is still copper."}

        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>12 g of magnesium reacts completely with 8 g of oxygen to form magnesium oxide. What mass of magnesium oxide is produced?</p>",
          "options": ["4 g", "12 g", "20 g", "It depends on how fast the reaction is"],
          "answer": 2,
          "explain": "Mass is conserved: 12 + 8 = 20 g. The atoms are only rearranged, so nothing can be gained or lost."
        },
        {
          "type": "wordeq",
          "marks": 2,
          "stem": "<p>Methane burns completely in oxygen. Build the word equation.</p>",

          "products": ["carbon dioxide", "water"],
          "bank": ["carbon monoxide", "hydrogen", "calcium oxide"],

        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>In the reaction <em>methane + oxygen → carbon dioxide + water</em>, one methane molecule reacts with two oxygen molecules. How many oxygen <strong>atoms</strong> are there in the reactants?</p>",
          "options": ["2", "4", "1", "8"],
          "answer": 1,
          "explain": "Each oxygen molecule contains 2 oxygen atoms, so 2 molecules contain 4 atoms. Those same 4 atoms end up in the products — 2 in the carbon dioxide and 2 in the two water molecules."
        },
        {
          "type": "wordeq",
          "marks": 2,
          "stem": "<p>Green copper carbonate is heated strongly and breaks down. Build the word equation.</p>",
          "reactants": ["copper carbonate"],

          "bank": ["copper hydroxide", "water", "oxygen"],
          "explain": "Thermal decomposition of a carbonate gives the metal oxide plus carbon dioxide. One reactant, two products."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>A substance is strongly heated and breaks down into two simpler substances. No oxygen was involved. Which type of chemical change is this?</p>",

          "answer": 2,
          "explain": "Breaking down by heat alone is thermal decomposition. Combustion and oxidation both require oxygen; neutralisation needs an acid and an alkali."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>Why is thermal decomposition a chemical change while melting is not?</p>",
          "options": [

            "Because melting can happen without heat",
            "Because thermal decomposition always produces a gas"
          ],
          "answer": 1,
          "explain": "This is the exact distinction your textbook flags. Melting changes state only; thermal decomposition produces genuinely different substances."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>Four iron nails are set up. Which one will rust?</p>",
          "options": [
            "In boiled water with a layer of oil on top",
            "In a sealed tube with a drying agent and ordinary air",

            "In a sealed tube containing only dry nitrogen gas"
          ],
          "answer": 2,
          "explain": "Rusting needs water AND oxygen. Only the open tube of tap water has both — boiling plus oil removes the oxygen, the drying agent removes the water, and dry nitrogen has neither."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>A solution has no effect on either red or blue litmus paper. What is it?</p>",
          "options": ["Strongly acidic", "Weakly acidic", "Neutral", "Alkaline"],
          "answer": 2,
          "explain": "Only a neutral solution leaves both papers unchanged. An acid turns blue litmus red; an alkali turns red litmus blue."
        },
        {
          "type": "mcq",
          "marks": 2,
          "stem": "<p>A student dips damp <strong>red</strong> litmus paper into an unknown liquid. It stays red, so the student concludes the liquid is acidic. Why is that conclusion flawed, and what should they do?</p>",
          "options": [
            "It is not flawed — red litmus staying red proves the liquid is acidic",
            "Water is neutral and also leaves red litmus unchanged, so they should retest with blue litmus or Universal Indicator",
            "The paper should have been dry; damp paper always gives a false result",
            "Red litmus only works on alkalis, so no conclusion is possible from any result"
          ],
          "answer": 1,
          "explain": "Red litmus stays red in both acidic AND neutral solutions, so a 'no change' result cannot distinguish an acid from water. Blue litmus turns red only in acid, and Universal Indicator gives an actual pH — either would settle it."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>Universal Indicator paper dipped into a soil sample turns dark blue, close to indigo. What is the approximate pH, and what does the gardener need?</p>",

            "About pH 3 — the soil is acidic and needs an alkali added",

          ],
          "answer": 2,
          "explain": "Blue to indigo on the Universal Indicator chart is around pH 8–9, so the soil is alkaline. Adding lime (an alkali) would push it further from neutral — the wrong treatment."
        },

          "type": "wordeq",
          "marks": 2,
          "stem": "<p>Sulfuric acid is neutralised by sodium hydroxide. Build the word equation.</p>",

          "bank": ["sodium chloride", "sodium nitrate", "hydrogen"],

          "pick": 2,
          "tag": "Optional for G2",
          "tier": "g2",

            "The decomposition of water using electricity",

            "The reaction between an acid and a piece of magnesium",
            "The combustion of petrol in air"
          ],
          "answer": [0, 2],
          "explain": "The 'pop' identifies hydrogen. Electrolysis of water produces hydrogen at the negative electrode, and acid + metal produces hydrogen. Acid + carbonate gives carbon dioxide; petrol combustion gives carbon dioxide and water vapour."

          "type": "wordeq",
          "marks": 2,
          "tag": "Optional for G2",
          "tier": "g2",
          "stem": "<p>Dilute hydrochloric acid is added to calcium carbonate. Build the word equation.</p>",

          "products": ["calcium chloride", "carbon dioxide", "water"],
          "bank": ["calcium sulfate", "hydrogen", "calcium hydroxide"],

        },

          "type": "mcq",
          "marks": 1,
          "tag": "Optional for G2",
          "tier": "g2",
          "stem": "<p>Dilute hydrochloric acid is added to copper turnings. Nothing happens. Why?</p>",
          "options": [

          "answer": 1,
          "explain": "Not all metals react with acids. Copper, silver and gold are relatively unreactive and produce no hydrogen with dilute acids — the basis of the original 'acid test' for gold."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>A gas relights a glowing splint. Which gas is it?</p>",
          "options": ["Hydrogen", "Carbon dioxide", "Oxygen", "Ammonia"],
          "answer": 2,
          "explain": "Rekindling a glowing splint is the test for oxygen. Hydrogen pops with a burning splint, carbon dioxide turns limewater chalky, and ammonia turns damp red litmus blue."
        },
        {
          "type": "mcq",
          "marks": 1,
          "stem": "<p>The colours of a poster near a sunny window have faded over two years. Which trigger caused this chemical change?</p>",

          "answer": 2,

          "tag": "Optional for G2",
          "tier": "g2",
          "stem": "<p>A silver spoon is to be electroplated with gold. Which statement is correct?</p>",
          "options": [
            "The spoon is the positive electrode and the gold is the negative electrode",

            "Both the spoon and the gold are negative electrodes",
            "It does not matter which way round they are connected"
          ],
          "answer": 1,
          "explain": "The object being plated is always the negative electrode. Positively charged gold particles are attracted to it and build up layer by layer, while the gold electrode dissolves into the solution."
        },

          "marks": 4,
          "stem": "<p>Fishes generally live in water that is neutral. Acidic gases such as sulfur dioxide and nitrogen dioxide dissolve in water to form acid rain, making lakes acidic and killing fish. Both calcium oxide and calcium carbonate can be used to neutralise acidic water.</p>",

              "stem": "Calcium oxide reacts with water to form calcium hydroxide, an alkali. Which should be used to neutralise the lake — calcium oxide or calcium carbonate? Explain.",

              ]
            }

        }
